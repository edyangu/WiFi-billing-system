<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adonis Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white;padding:20px}
h1{color:#facc15;margin-bottom:20px}
.cards{display:flex;gap:15px;flex-wrap:wrap}
.card{background:#1a1a1a;border:1px solid #333;padding:20px;border-radius:15px;min-width:150px;flex:1}
.card h3{color:#888;font-size:12px}
.card p{font-size:24px;margin-top:10px;font-weight:bold}
table{width:100%;margin-top:25px;background:#1a1a1a;border-radius:15px;overflow:hidden;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #222;font-size:13px}
th{color:#888;font-size:11px}
.status-paid{color:#4ade80;font-weight:bold}
.status-pending{color:#facc15;font-weight:bold}
</style>
</head>
<body>
<h1>ADONIS WIFI - ADMIN</h1>
<div class="cards">
<div class="card"><h3>TOTAL REQUESTS</h3><p id="total">0</p></div>
<div class="card"><h3>PAID</h3><p id="paid">0</p></div>
<div class="card"><h3>VOUCHERS</h3><p id="vouchers">0</p></div>
</div>
<table>
<thead>
<tr>
<th>Phone</th>
<th>Plan</th>
<th>Amount</th>
<th>Method</th>
<th>Status</th>
<th>Voucher</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
<script>
let backend = 'https://wifi-billing-system-1-mcg0.onrender.com';

async function load(){
try{
let res = await fetch(backend + '/admin/stats');
let d = await res.json();

document.getElementById('total').innerText = d.total;
document.getElementById('paid').innerText = d.paid;
document.getElementById('vouchers').innerText = d.vouchers;

let html = '';
Object.values(d.payments).forEach(p => {
let statusClass = p.status === 'paid' ? 'status-paid' : 'status-pending';
html += `<tr>
<td>${p.phone || '-'}</td>
<td>${p.plan || '-'}</td>
<td>${p.amount || '-'}</td>
<td>${p.method || '-'}</td>
<td class="${statusClass}">${p.status || '-'}</td>
<td>${p.voucher || '-'}</td>
</tr>`;
});

if(html === ''){
html = '<tr><td colspan="6" style="text-align:center;color:#888">No payments yet</td></tr>';
}

document.getElementById('list').innerHTML = html;

}catch(e){
console.error('ADMIN ERROR:', e);
document.getElementById('list').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#facc15">Backend offline or unreachable</td></tr>';
}
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
